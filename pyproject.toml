[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-token-manager"
version = "0.1.0"
description = "LLM Token Management System with FastAPI, PostgreSQL, and Celery"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Shubham Singh", email = "shubh2014shiv@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # --- CORE FRAMEWORK & SERVER ---
    "fastapi>=0.117.1",
    "uvicorn[standard]>=0.37.0",
    # --- ASYNC TASKS & MESSAGE BROKER ---
    "celery>=5.5.3",
    "redis>=5.2.0",
    "hiredis>=3.0.0",
    # --- DATABASE & PERSISTENCE ---
    "psycopg[binary,pool]>=3.2.1",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.44",
    "asyncpg>=0.29.0",
    # --- LLM PROVIDERS & AI SDKs ---
    "tiktoken>=0.8.0",
    "litellm>=1.55.0",
    # --- CONFIGURATION & DATA VALIDATION ---
    "pydantic[email]>=2.9.2",
    "pydantic-settings>=2.6.1",
    # --- LOGGING & MONITORING ---
    "loguru>=0.7.2",
    # --- UTILITIES & NETWORKING ---
    "python-dotenv>=1.0.1",
    "httpx>=0.27.2",
    "tenacity>=9.0.0",
    # --- PASSWORD HASHING ---
    "bcrypt>=4.3.0",
    "passlib[bcrypt]>=1.7.4",
    # --- JWT AUTHENTICATION ---
    "python-jose[cryptography]>=3.3.0",
    # --- RATE LIMITING ---
    "limits>=5.8.0",
    "pybreaker>=1.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "requests-mock>=1.12.1",
    "ruff>=0.14.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
    "pyright>=1.1.396",
    "rich>=13.0",
    "ipython>=8.0",
]

# ================================================================
# Hatch build configuration
# ================================================================
[tool.hatch.build.targets.wheel]
packages = ["app"]

# ================================================================
# UV - Dev dependency groups (native UV feature)
# ================================================================
[dependency-groups]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "requests-mock>=1.12.1",
    "ruff>=0.14.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
    "pyright>=1.1.396",
    "rich>=13.0",
    "ipython>=8.0",
]

# ================================================================
# Ruff - Fast Python linter + formatter (replaces black, isort, flake8)
# ================================================================
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # Pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "D",       # pydocstyle
    "UP",      # pyupgrade
    "B",       # flake8-bugbear
    "C4",      # flake8-comprehensions
    "SIM",     # flake8-simplify
    "TCH",     # flake8-type-checking-imports
]
ignore = [
    "D100",    # missing docstring in public module
    "D104",    # missing docstring in public package
    "D107",    # missing docstring in __init__
    "D203",    # incompatible with D211 (1 blank line before class)
    "D212",    # incompatible with D213 (multi-line summary)
    "D401",    # imperative mood - too noisy for existing codebase
    "D413",    # blank line after last section - too pedantic
]
fixable = ["ALL"]

[tool.ruff.lint.mccabe]
max-complexity = 30

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["app"]
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = [
    "D205",
    "D400",
    "D415",
    "D417",
    "E501",
    "B008",
    "B904",
]
"app/models/*.py" = [
    "D101",
    "D102",
    "D105",
    "D106",
    "D200",
    "D205",
    "D400",
    "D415",
    "E501",
]
"tests/*.py" = [
    "D101",
    "D102",
    "D103",
    "D105",
    "D106",
    "D200",
    "D205",
    "D400",
    "D415",
    "E501",
    "B007",
    "B017",
    "SIM117",
]
"app/psql_db_services/*.py" = [
    "D200",
    "D205",
    "D400",
    "D415",
    "D417",
    "E501",
]
"app/persistence/*.py" = [
    "D200",
    "D205",
    "D400",
    "D415",
    "D417",
    "E501",
]
"tests/**/*.py" = [
    "D101",
    "D102",
    "D103",
    "D105",
    "D106",
    "D200",
    "D205",
    "D400",
    "D415",
    "E501",
    "B007",
    "B017",
    "SIM117",
]

# ================================================================
# Pyright - Static type checker (CI-focused)
# ================================================================
[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["app"]
exclude = [
    "**/__pycache__",
    "**/.venv",
    "**/venv",
    "**/migrations",
    "tests",
    "**/*_DELETE.py",
    "**/*_OBSELETE.py",
]
reportMissingImports = false
reportMissingTypeStubs = false
reportGeneralTypeIssues = true
reportOptionalMemberAccess = true
reportOptionalSubscript = true
reportPrivateUsage = false
reportUnusedVariable = true
reportUnusedImport = true

# ================================================================
# MyPy - Static type checker configuration
# ================================================================
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "redis.*",
    "psycopg2.*",
    "tiktoken.*",
    "google.generativeai.*",
    "openai.*",
    "loguru.*",
    "tenacity.*",
    "httpx.*",
    "passlib.*",
    "jose.*",
    "litellm.*",
    "asyncpg.*",
]
ignore_missing_imports = true

# ================================================================
# Pytest configuration
# ================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov-report=term-missing",
]
markers = [
    "integration: marks tests as integration tests (require database)",
    "unit: marks tests as unit tests (no external dependencies)",
    "slow: marks tests as slow running",
]
asyncio_mode = "auto"

# ================================================================
# Coverage configuration
# ================================================================
[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
    "*/migrations/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# ================================================================
# Pylint configuration (kept for optional use)
# ================================================================
[tool.pylint.main]
fail-under = 8.0
ignore = ["migrations", "venv", ".venv"]
jobs = 0
limit-inference-results = 100
persistent = true
py-version = "3.10"
suggestion-mode = true

[tool.pylint.messages_control]
disable = [
    "C0103",  # invalid-name
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "R0903",  # too-few-public-methods
    "R0913",  # too-many-arguments
    "W0212",  # protected-access
    "W0511",  # fixme
]

[tool.pylint.format]
max-line-length = 88

[tool.pylint.design]
max-args = 7
max-attributes = 10
max-bool-expr = 5
max-branches = 12
max-locals = 15
max-parents = 7
max-public-methods = 20
max-returns = 6
max-statements = 50
min-public-methods = 1
