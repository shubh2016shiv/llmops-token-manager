# =============================================================================
#  BASE / CHASSIS  —  llm_token_manager
# =============================================================================
#  This file deliberately declares NO services.
#
#  It holds only the things every service plugs INTO:
#     1. the project name      (what Docker prefixes resources with)
#     2. the networks          (the wires)
#     3. the volumes           (the disks)
#
#  Services live in one file per tier, under infra/compose/:
#
#     infra/compose/compose.data.yml       -> pgbouncer          (data access)
#     infra/compose/compose.messaging.yml  -> redis, rabbitmq     (transport)
#     infra/compose/compose.app.yml        -> api, consumer       (compute)
#     infra/compose/compose.dev.yml        -> local-dev overrides
#     infra/compose/compose.prod.yml       -> hardened overrides
#
#  Those files are chained together by COMPOSE_FILE in .env, so you just run:
#
#     docker compose up -d
#
#  ---------------------------------------------------------------------------
#  WHY IS THIS FILE AT THE REPO ROOT AND NOT IN infra/compose/ ?
#  ---------------------------------------------------------------------------
#  Compose sets the "project directory" to the directory of the FIRST file in
#  the chain. Every relative path (build.context, bind-mount sources, env_file)
#  is resolved from that directory.
#
#  Keeping the base file here means the project directory is the repo root, so
#  paths read naturally everywhere:  ./app,  ./infra/config/redis/redis.conf.
#  If the base file lived in infra/compose/, every path would need ../../ .
#
#  ---------------------------------------------------------------------------
#  WHY ARE LOGGING/LABEL ANCHORS REPEATED IN EACH TIER FILE?
#  ---------------------------------------------------------------------------
#  YAML anchors (&name) and aliases (*name) are resolved by the YAML parser
#  WITHIN A SINGLE DOCUMENT, before Compose ever merges files together. An
#  anchor defined here is therefore invisible to infra/compose/*.yml.
#
#  So each tier file defines its own small anchor block. That is not sloppy
#  duplication — it is what makes each tier file readable standalone, which is
#  the whole point of splitting them. (The cross-file alternative is `extends`,
#  discussed in infra/docs/00-mental-model.md.)
# =============================================================================

# The project name prefixes every container, network, and volume Docker creates
# and is what keeps this stack distinct from llm_services on the same daemon.
name: llm_token_manager

# =============================================================================
#  NETWORKS — "where is the network defined?" Right here. This is the only
#             place in the whole stack that creates a network.
# =============================================================================
#
#  Two networks, on purpose. This is least-privilege applied to networking:
#  a container can only open a TCP connection to something it shares a network
#  with. Anything not on a shared network is unreachable, full stop.
#
#      ┌──────────────────── platform_net (owned by llm_services) ───────────┐
#      │                                                                     │
#      │   llm_services postgres  ◄────────────┐                             │
#      │                                       │                             │
#      └───────────────────────────────────────┼─────────────────────────────┘
#                                              │ only pgbouncer crosses over
#      ┌──────────────── token_manager_net ────┼─────────────────────────────┐
#      │                                       │                             │
#      │   api ──┬──► pgbouncer ───────────────┘                             │
#      │         ├──► redis                                                  │
#      │         └──► rabbitmq                                               │
#      │   consumer ─┴─► (same three)                                        │
#      │                                                                     │
#      └─────────────────────────────────────────────────────────────────────┘
#
#  PgBouncer is the ONLY service attached to both. That makes it a deliberate
#  chokepoint: the API and the consumer physically cannot reach PostgreSQL
#  except through the pooler. It is enforced by network topology rather than by
#  developer discipline, so it cannot be forgotten or bypassed later.
#
networks:
  # ---------------------------------------------------------------------------
  # platform_net — NOT created here. Created and owned by llm_services.
  # ---------------------------------------------------------------------------
  # `external: true` means "this network already exists; attach, do not create".
  # If it is missing, Compose fails fast with a clear error instead of silently
  # creating an empty network your database is not on.
  #
  # WHY THIS NAME: llm_services/docker-compose.yml declares `networks: llm_net:`
  # with no `name:` key, so Compose prefixes it with ITS project name
  # (the directory, llm_services) producing the real network `llm_services_llm_net`.
  # `external` needs that real on-daemon name, not the short alias.
  #
  # Start order therefore matters: llm_services must be up first.
  #   cd ../llm_services && docker compose up -d postgres
  platform_net:
    external: true
    name: ${PLATFORM_NETWORK_NAME:-llm_services_llm_net}

  # ---------------------------------------------------------------------------
  # token_manager_net — this stack's own private network. We DO create this.
  # ---------------------------------------------------------------------------
  # `driver: bridge` is the standard single-host driver. Its most useful
  # property is the built-in DNS server: every service name becomes a
  # resolvable hostname on this network. That is why compose.app.yml can say
  # REDIS_HOST: redis and it simply works — no IP addresses anywhere.
  token_manager_net:
    driver: bridge
    labels:
      com.llm-token-manager.project: llm-token-manager
      com.llm-token-manager.network: token-manager-internal

# =============================================================================
#  VOLUMES — durable disks that outlive containers
# =============================================================================
#
#  A container's own filesystem is deleted with the container. Anything that
#  must survive `docker compose down` needs a named volume mounted over the
#  path where the process writes its state.
#
#  NOTE WHAT IS ABSENT: there is no postgres volume here. This stack does not
#  own a database — see infra/docs/04-decisions.md, ADR-001. The token manager
#  reads and writes llm_services' PostgreSQL through PgBouncer.
#
volumes:
  # Redis persistence (appendonly file + snapshots). This holds live token
  # allocation counters, so losing it is a correctness event, not just a
  # cold-cache event. See ADR-003 for why this Redis runs `noeviction`.
  redis_data:
    name: llm_tm_redis_data
    labels:
      com.llm-token-manager.project: llm-token-manager
      com.llm-token-manager.volume: redis-data

  # RabbitMQ persistence: durable queue definitions and persisted messages.
  # Without this, a restart silently discards queued allocation work.
  rabbitmq_data:
    name: llm_tm_rabbitmq_data
    labels:
      com.llm-token-manager.project: llm-token-manager
      com.llm-token-manager.volume: rabbitmq-data

  # ---------------------------------------------------------------------------
  # Application log volumes — used ONLY by infra/compose/compose.prod.yml
  # ---------------------------------------------------------------------------
  # They are declared here rather than in the prod overlay because volumes are a
  # base-level concern: this file is the single answer to "what disks exist?".
  # Declaring them here costs nothing when the prod overlay is not loaded —
  # Compose creates a volume only when a service actually mounts it.
  #
  # WHY THEY EXIST AT ALL: compose.prod.yml sets `read_only: true` on api and
  # token_queue_consumer, but app/core/logging.py writes logs/app_{time}.log
  # relative to WORKDIR /app. With a read-only root, /app/logs must be mounted
  # writable or the app dies on its first log line.
  api_logs:
    name: llm_tm_api_logs
    labels:
      com.llm-token-manager.project: llm-token-manager
      com.llm-token-manager.volume: api-logs

  consumer_logs:
    name: llm_tm_consumer_logs
    labels:
      com.llm-token-manager.project: llm-token-manager
      com.llm-token-manager.volume: consumer-logs
