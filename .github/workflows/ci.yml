name: Python CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: mypassword
          POSTGRES_DB: mydb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # pyproject.toml + uv.lock are this project's ONLY dependency manifest
      # (matches ../llm_services, which has no requirements.txt at all).
      # requirements.txt / requirements-dev.txt were a hand-maintained second
      # manifest that had already drifted from uv.lock — aiobreaker, coredis,
      # and pyyaml were declared in pyproject.toml and imported by live code,
      # but missing from requirements.txt, so anything built from it crashed
      # with ModuleNotFoundError. See infra/docs/04-decisions.md ADR-010.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          # --frozen: fail rather than silently re-resolve if uv.lock does
          # not match pyproject.toml, instead of installing an incomplete set.
          uv sync --frozen
          # radon has no pyproject.toml entry (used only for the duplication
          # report below, never imported by application code).
          uv pip install radon bandit safety

      - name: Code Quality Analysis
        run: |
          # Apply fixes and formatting with Ruff (replaces autoflake, pyupgrade, add-trailing-comma, black, isort)
          uv run ruff check --fix app/ tests/
          uv run ruff format app/ tests/

          # Verify no remaining lint issues (replaces flake8 checks; use --output-format=github for annotations)
          uv run ruff check --output-format=github app/ tests/

          # Type checking (unchanged)
          uv run mypy app/ --config-file=mypy.ini

      - name: Commit formatting changes
        if: github.event_name == 'pull_request'
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add .
            git commit -m "style: auto-format and lint with Ruff"
            git push
          fi

      # - name: Security Analysis
      #   run: |
      #     # Code security scan
      #     # bandit -r app/ -c pyproject.toml -ll  # TEMP: Disabled for SQL refactor (B608 issues)

      #     # Dependencies security check
      #     safety check

      - name: Code Duplication Analysis
        run: |
          uv run radon cc app/ -a -s
          uv run radon mi app/ -s
          uv run radon raw app/ -s

      # ------------------------------------------------------------------
      # KNOWN PRE-EXISTING ISSUE, NOT FIXED HERE (out of scope for a
      # dependency-manifest cleanup — flagged rather than silently patched):
      #
      # `postgres_schema/initial_schema.sql` in THIS repo is an empty
      # DIRECTORY, not a file (see infra/docs/04-decisions.md ADR-008), so
      # the `psql -f` line below currently fails. It predates this change.
      #
      # It also predates ADR-001: this project no longer owns its schema —
      # llm_services does, via its own postgres_schema/*.sql in creation-
      # order. Whether CI should keep spinning up a throwaway local Postgres
      # seeded from a copy of llm_services' schema, or something else
      # entirely, is a real decision this cleanup does not make unilaterally.
      # ------------------------------------------------------------------
      - name: Run Tests with Coverage
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: mydb
          DATABASE_USER: myuser
          DATABASE_PASSWORD: mypassword
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          # Initialize test database
          PGPASSWORD=mypassword psql -h localhost -U myuser -d mydb -f postgres_schema/initial_schema.sql

          # Run tests with coverage, excluding app/models/* and */__init__.py
          uv run coverage run --omit="app/models/*,*/__init__.py,app/app.py,index.py" -m pytest tests/ \
            --durations=10 \
            -v

          # Generate reports (xml for codecov, term for console, html for local viewing)
          uv run coverage report --show-missing  # Adds missing line details like term-missing
          uv run coverage html

      - name: Verify Coverage Threshold
        run: |
          echo "Verifying minimum coverage threshold of 80%"
          coverage_threshold=80
          coverage_result=$(uv run coverage report | grep "TOTAL" | awk '{print $NF}' | sed 's/%//')
          echo "Current coverage: $coverage_result%"

          if (( $(echo "$coverage_result < $coverage_threshold" | bc -l) )); then
            echo "Coverage ($coverage_result%) is below minimum threshold of $coverage_threshold%"
            exit 1
          else
            echo "Coverage ($coverage_result%) meets minimum threshold of $coverage_threshold%"
          fi

      # - name: Upload Coverage Report
      #   uses: codecov/codecov-action@v4
      #   with:
      #     file: ./coverage.xml
      #     fail_ci_if_error: true
      #     token: ${{ secrets.CODECOV_TOKEN }}
