;
; PgBouncer Configuration — LLM Token Manager
; =============================================
; Pool mode: TRANSACTION (recommended for high-write async workloads)
;
; Why transaction mode over session mode?
;   - Session mode: app holds a PG connection for the entire client session lifetime.
;     Bad for async apps (FastAPI/asyncpg) with short-lived, high-frequency queries.
;   - Transaction mode: PG connection held only for the duration of one transaction.
;     A single PG connection can serve hundreds of async clients round-robin.
;     Ideal for INSERT-heavy token allocation workloads.
;
; Sizing:
;   pool_size=25 matches SQLAlchemy engine's (pool_size=20 + max_overflow=10) ceiling.
;   App-side pool should be set to NullPool or pool_size=1 when routing through PgBouncer
;   to avoid double-pooling. See app/core/database.py notes.
;
; Ports:
;   PgBouncer listens on 6432 (internal Docker network)
;   PostgreSQL listens on 5432 (internal Docker network, not exposed externally)
;

[databases]
; "mydb" is the database alias clients connect to.
; PgBouncer forwards to postgres:5432/mydb (internal Docker network)
mydb = host=postgres port=5432 dbname=mydb

[pgbouncer]
; --- Connection settings ---
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt

; --- Pool settings ---
; TRANSACTION mode: connection returned to pool after each transaction commit/rollback.
; This is the correct mode for FastAPI+asyncpg short-lived queries.
pool_mode = transaction

; Max PG backend connections per database+user pair.
; Set to match PostgreSQL max_connections minus reserved connections.
; With max_connections=100 in PG, keep this at 25-30 for headroom.
default_pool_size = 25

; Hard cap on total backend connections across all pools.
max_client_conn = 500

; Minimum idle connections kept open per pool (warm pool for burst readiness).
min_pool_size = 5

; Extra connections above pool_size PgBouncer can open when pool is exhausted.
; Acts as a short-lived burst buffer before clients queue.
reserve_pool_size = 5

; Seconds a client waits for a connection before receiving an error.
; Set to match application-level DB timeout.
reserve_pool_timeout = 5

; --- Idle/lifecycle settings ---
; Seconds a server-side connection can be idle before being closed.
server_idle_timeout = 60

; Seconds before unused client connections are closed.
client_idle_timeout = 60

; Recycle server connections after this many seconds (prevents long-lived PG session issues).
server_lifetime = 3600

; --- Health checks ---
; PgBouncer pings idle server connections to detect failures early.
server_check_delay = 30
server_check_query = SELECT 1

; --- Logging ---
; Log levels: 0=crit, 1=error, 2=warn, 3=info, 4=debug, 5=verbose, 6=debug+noise
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60

; --- Tuning for async apps ---
; Disable prepared statements (asyncpg uses them; PgBouncer transaction mode
; requires this to be OFF or use session-level prepared statement tracking).
; asyncpg sends `statement_timeout` and similar session params on connect —
; set ignore_startup_parameters to suppress PgBouncer warnings.
ignore_startup_parameters = extra_float_digits,statement_timeout,lock_timeout

; --- Admin interface ---
; PgBouncer admin DB accessible at "pgbouncer" database name.
; Use: psql -h localhost -p 6432 -U pgbouncer_admin pgbouncer
admin_users = pgbouncer_admin
stats_users = pgbouncer_admin
