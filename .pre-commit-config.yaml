# ============================================================
# Pre-commit hooks for LLM Token Manager
# UV-powered | Ruff (linter + formatter) | Pyright (type checker)
# ============================================================
#
# SETUP:
#   1. uv sync --dev                          # Install all deps including dev
#   2. uv run pre-commit install              # Install git hook scripts
#   3. uv run pre-commit run --all-files      # Run all hooks on all files (first time)
#
# USAGE:
#   - Auto-runs on `git commit` (staged files only)
#   - Skip hooks:  git commit --no-verify
#   - Run manually: uv run pre-commit run --all-files
#
# WHAT THESE HOOKS DO:
#   1. ruff (--fix):    Auto-fixes lint violations + sorts imports
#   2. ruff-format:     Auto-formats code (black-compatible style)
#   3. pyright:         Static type checking (basic mode)
#   4. pre-commit-hooks: Trailing whitespace, YAML validation, merge conflicts, etc.
# ============================================================

repos:
  # Ruff: Fast Python linter + formatter (replaces black, isort, flake8, autoflake)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      # Linter with auto-fix enabled
      # B008: Depends() in defaults is standard FastAPI pattern
      - id: ruff
        args: [--fix, --ignore=B008]
      # Formatter (black-compatible)
      - id: ruff-format

  # Pyright: Static type checker
  # Uses a local wrapper so we type-check only staged Python files and
  # explicitly skip anything ignored by `.gitignore`.
  # Explanation:
  # - pre-commit passes staged filenames to this hook (`pass_filenames: true`)
  # - scripts/pyright_staged.py filters to existing `.py` files
  # - scripts/pyright_staged.py calls `git check-ignore` and drops ignored files
  # - then it runs: `uv run pyright <filtered-staged-files...>`
  - repo: local
    hooks:
      - id: pyright
        name: pyright (staged files only)
        entry: uv run python scripts/pyright_staged.py
        language: system
        types: [python]
        files: ^app/.*\.py$
        pass_filenames: true

  # Basic file checks (fast, zero-config)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-merge-conflict
      - id: detect-private-key

default_language_version:
  python: python3.11

exclude: |
  (?x)^(
      .*/__pycache__/.*|
      .*/.venv/.*|
      .*/venv/.*
  )$
