# ============================================================
# Pre-commit hooks for LLM Token Manager
# UV-powered | Ruff (linter + formatter)
# ============================================================
#
# SETUP:
#   1. uv sync --dev                          # Install all deps including dev
#   2. uv run pre-commit install              # Install git hook scripts
#   3. uv run pre-commit run --all-files      # Run all hooks on all files (first time)
#
# USAGE:
#   - Auto-runs on `git commit` (staged files only)
#   - Skip hooks:  git commit --no-verify
#   - Run manually: uv run pre-commit run --all-files
#
# WHAT THESE HOOKS DO:
#   1. ruff (--fix):    Auto-fixes lint violations + sorts imports
#   2. ruff-format:     Auto-formats code (black-compatible style)
#   3. pre-commit-hooks: Trailing whitespace, YAML validation, merge conflicts, etc.
#
# Pyright (type checking) was removed from this hook: this repo is mid-refactor
# with many files partially staged, and pre-commit only type-checks the staged
# snapshot (it stashes unstaged changes for the duration of the run) — so it was
# flagging cross-file mismatches between old-staged and new-unstaged code, not
# real bugs in the final working tree. Run `uv run pyright app` manually/in CI
# once the refactor is fully staged/committed.
# ============================================================

repos:
  # Ruff: Fast Python linter + formatter (replaces black, isort, flake8, autoflake)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      # Linter with auto-fix enabled
      # B008: Depends() in defaults is standard FastAPI pattern
      - id: ruff
        args: [--fix, --ignore=B008]
      # Formatter (black-compatible)
      - id: ruff-format

  # Basic file checks (fast, zero-config)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-merge-conflict
      - id: detect-private-key

default_language_version:
  python: python3.11

exclude: |
  (?x)^(
      .*/__pycache__/.*|
      .*/.venv/.*|
      .*/venv/.*
  )$
